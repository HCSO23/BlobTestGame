<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Blob Devour</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%2358c4a8'/></svg>">
<style>
  :root {
    --bg: #11151c;
    --grid: #1c232e;
    --edge: #e05d5d;
    --text: #e8edf3;
    --muted: #8a96a6;
    --panel: rgba(17, 21, 28, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent: #58c4a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
  #hud .row { display: flex; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hud b { color: var(--text); font-weight: 600; }
  #name { width: 160px; background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 5px 8px; font: inherit; outline: none; }
  #name:focus { border-color: var(--accent); }
  #lb { top: 12px; right: 12px; min-width: 170px; }
  #lb h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #lb ol { margin: 0; padding-left: 20px; }
  #lb li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; font-variant-numeric: tabular-nums; }
  #lb li.me { color: var(--accent); font-weight: 600; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #overlay div { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px 26px;
    text-align: center; font-size: 18px; }
  #overlay small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  #status { bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--muted); display: none; }
  @media (max-width: 520px) {
    #lb { min-width: 0; padding: 8px 10px; font-size: 12px; }
    #lb li { max-width: 120px; }
    #name { width: 120px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="panel">
  <input id="name" maxlength="16" placeholder="Your name" aria-label="Your name" autocomplete="off">
  <div class="row"><span>Mass <b id="mass">0</b></span><span>Online <b id="online">0</b></span></div>
</div>
<div id="lb" class="panel"><h2>Leaderboard</h2><ol id="lbList"></ol></div>
<div id="overlay"><div><span id="deathMsg">You were eaten!</span><small>Respawning…</small></div></div>
<div id="status" class="panel">Connecting…</div>
<script src="game.js"></script>
</body>
</html>
